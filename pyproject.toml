[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "filesysman"
version = "1.0.0"
description = "Utilities for managing files and folders in Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
    {name = "Saif Bayoumy"},
]

[tool.setuptools]
packages = ["filesysman"]